# ─────────────────────────────────────────────────────────────────────────────
# gradle/wrapper/gradle-wrapper.properties
# PLACEHOLDER – replace with a real wrapper after bootstrapping.
#
# ── How to generate a real Gradle wrapper ────────────────────────────────────
# 1. Install Gradle locally (https://gradle.org/install/) or use the SDK
#    Manager in Android Studio.
# 2. Run:
#       gradle wrapper --gradle-version 8.7 --distribution-type all
#    from the repository root.  This overwrites this placeholder with a
#    real wrapper (including the validated SHA-256 checksum).
# 3. Commit gradlew, gradlew.bat, gradle/wrapper/gradle-wrapper.jar, and
#    this file.  The .jar must be committed for the wrapper to work offline.
# 4. In CI and Codespaces, always invoke ./gradlew (never a system gradle)
#    so the version is pinned to what is declared here.
#
# ── Gradle version guidance ───────────────────────────────────────────────────
# AGP 8.4.x requires Gradle 8.6+.
# Check compatibility: https://developer.android.com/build/releases/gradle-plugin
# ─────────────────────────────────────────────────────────────────────────────
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
