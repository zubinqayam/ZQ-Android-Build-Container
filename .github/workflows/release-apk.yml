# =============================================================================
# .github/workflows/release-apk.yml
# Signed release APK build – triggers only on version tags (e.g. v1.2.3).
#
# ── Forking / reuse notes ────────────────────────────────────────────────────
# 1. Fork or copy this repo.
# 2. Generate a release keystore and base64-encode it:
#      keytool -genkey -v -keystore release.jks -alias <ALIAS> \
#              -keyalg RSA -keysize 4096 -validity 10000
#      base64 -w0 release.jks > release.jks.b64
# 3. Add the following repository secrets (Settings → Secrets → Actions):
#      RELEASE_KEYSTORE_B64   – base64 content of release.jks.b64
#      KEY_ALIAS              – keystore alias
#      KEY_PASSWORD           – key password
#      STORE_PASSWORD         – store password
# 4. Push a tag matching "v*" to trigger this workflow.
#
# ── Signing activation ────────────────────────────────────────────────────────
# Signing is always active in this workflow.  To perform an *unsigned* release
# build (e.g. for sideloading to a managed fleet), comment out the
# "Configure signing" and "Sign APK" steps and use assembleRelease directly
# (the output will be unsigned and unaligned – handle alignment yourself).
#
# ── OTA manifest update ──────────────────────────────────────────────────────
# After a successful build the workflow writes the new version, sha256, and
# download URL into .github/ota/ota-manifest.json and commits it back to the
# repo.  Disable this by removing the "Update OTA manifest" step.
# =============================================================================

name: Release Signed APK

on:
  push:
    tags:
      - "v*.*.*"   # semver tags: v1.0.0, v2.3.1, etc.

  # Allow manual trigger (useful for testing the pipeline without tagging)
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Version string to embed in the APK (e.g. 1.0.0)"
        required: false
        default: "0.0.0-manual"

env:
  COMPILE_SDK: "34"
  BUILD_TOOLS: "34.0.0"
  ANDROIDSDKROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME:   ${{ github.workspace }}/android-sdk

jobs:
  release-signed:
    name: Assemble & Sign Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    # Only run on the default branch or when triggered by a tag push.
    # Remove this condition if you need to run on feature branches.
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: write   # needed to push the OTA manifest commit

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can read the tag message

      # ── 2. JDK ───────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # ── 3. Android SDK ────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}

      # ── 4. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 5. Derive version string ─────────────────────────────────────────────
      - name: Derive version name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.tag_override }}"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      # ── 6. Configure signing ──────────────────────────────────────────────────
      # Decodes the base64 keystore secret into a temp file.
      # The path is passed to Gradle via environment variables consumed by
      # the signingConfigs block in app/build.gradle.
      #
      # ⚠ Never commit a real keystore or plaintext passwords to source control.
      - name: Configure signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          echo "${RELEASE_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
          echo "SIGNING_KEYSTORE_PATH=${KEYSTORE_PATH}"          >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"      >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"

      # ── 7. Make Gradle wrapper executable ───────────────────────────────────
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # ── 8. Build release APK ─────────────────────────────────────────────────
      - name: Assemble release APK
        run: >
          ./gradlew assembleRelease
          --no-daemon
          --stacktrace
          -PversionName=${{ steps.version.outputs.name }}

      # ── 9. Compute SHA-256 of the output APK ─────────────────────────────────
      - name: Compute APK checksum
        id: checksum
        run: |
          APK_DIR="app/build/outputs/apk/release"
          apks=("${APK_DIR}"/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "Expected exactly 1 APK in ${APK_DIR}, but found ${#apks[@]}:" >&2
            printf '  %s\n' "${apks[@]}" >&2 || true
            exit 1
          fi
          APK_PATH="${apks[0]}"
          SHA256=$(sha256sum "${APK_PATH}" | awk '{print $1}')
          echo "sha256=${SHA256}"   >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "APK: ${APK_PATH}"
          echo "SHA-256: ${SHA256}"

      # ── 10. Upload signed APK as artifact ────────────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.name }}
          path: ${{ steps.checksum.outputs.apk_path }}
          retention-days: 90

      # ── 11. Create GitHub Release and attach APK ─────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.checksum.outputs.apk_path }}
          generate_release_notes: true
          body: |
            **Version:** ${{ steps.version.outputs.name }}
            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`

      # ── 12. Update OTA manifest ───────────────────────────────────────────────
      # Writes version + sha256 + download URL into .github/ota/ota-manifest.json
      # and commits back to the default branch.
      #
      # To disable OTA manifest updates, delete this step.
      - name: Update OTA manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.name }}
          SHA256:  ${{ steps.checksum.outputs.sha256 }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${GITHUB_REF#refs/tags/}"
          APK_BASENAME="$(basename "${{ steps.checksum.outputs.apk_path }}")"
          export DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${APK_BASENAME}"

          python3 - <<'PYEOF'
          import json, os, pathlib

          manifest_path = pathlib.Path(".github/ota/ota-manifest.json")
          manifest = json.loads(manifest_path.read_text())

          manifest["latestVersion"]  = os.environ["VERSION"]
          manifest["sha256"]         = os.environ["SHA256"]
          manifest["downloadUrl"]    = os.environ["DOWNLOAD_URL"]
          manifest["releaseDate"]    = __import__("datetime").date.today().isoformat()

          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print("OTA manifest updated.")
          PYEOF

      - name: Commit updated OTA manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ota/ota-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ota): update manifest for v${{ steps.version.outputs.name }} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          else
            echo "OTA manifest unchanged – nothing to commit."
          fi

      # ── 13. Clean up signing material ─────────────────────────────────────────
      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
