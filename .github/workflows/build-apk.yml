# =============================================================================
# .github/workflows/build-apk.yml
# Debug APK build – triggers on every push and pull-request.
#
# ── How to switch build type ─────────────────────────────────────────────────
# • Debug (default)  : ./gradlew assembleDebug   → app/build/outputs/apk/debug/
# • Release (unsigned): change task to assembleRelease; see release-apk.yml
#   for the fully-signed, tag-gated release pipeline.
#
# ── Signing ──────────────────────────────────────────────────────────────────
# Debug builds use the automatically-generated Android debug keystore; no
# secrets are required.  For signed release builds, see release-apk.yml.
#
# ── Android SDK ──────────────────────────────────────────────────────────────
# ANDROIDSDKROOT is the canonical variable name used throughout this repo.
# ANDROID_HOME is set as an alias so legacy tooling keeps working.
# =============================================================================

name: Build Debug APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

env:
  # ── SDK / build versions ───────────────────────────────────────────────────
  # Keep in sync with app/build.gradle and install-android-sdk.sh
  COMPILE_SDK: "34"
  BUILD_TOOLS: "34.0.0"

  # ── Canonical SDK path variable ───────────────────────────────────────────
  # Do NOT rename ANDROIDSDKROOT without also updating devcontainer.json and
  # install-android-sdk.sh.
  ANDROIDSDKROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME:   ${{ github.workspace }}/android-sdk

jobs:
  build-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      contents: read   # read the repository source; no write access needed

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK ───────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # ── 3. Android SDK ────────────────────────────────────────────────────────
      # Uses the official setup-android action; mirrors the SDK versions used
      # in install-android-sdk.sh so Codespace and CI are in parity.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}

      # ── 4. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 5. Make Gradle wrapper executable ───────────────────────────────────
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # ── 6. Build ─────────────────────────────────────────────────────────────
      # Change "assembleDebug" to "assembleRelease" (+ signing config) for
      # unsigned release builds.  For fully signed release builds use the
      # separate release-apk.yml workflow.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 7. Upload artifact ────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── 8. (Optional) Run unit tests ─────────────────────────────────────────
      # Uncomment when you have JVM unit tests:
      # - name: Run unit tests
      #   run: ./gradlew test --no-daemon
      # - name: Upload test results
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: test-results-${{ github.sha }}
      #     path: app/build/reports/tests/
